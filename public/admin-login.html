<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Wanderers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
</head>
<body class="antialiased flex items-center justify-center min-h-screen px-4">
    <div class="ambient-bg">
        <div class="blob blob-1" style="top:-20%; left:10%;"></div>
        <div class="blob blob-2" style="top:40%; right:5%;"></div>
        <div class="noise-overlay"></div>
    </div>

    <div data-reveal data-reveal="scale" class="relative z-10 max-w-md w-full glass-strong p-8 md:p-10" style="border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-5" style="background:var(--gradient-primary); box-shadow:var(--shadow-glow);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h2 class="font-display text-2xl font-bold">Admin Login</h2>
            <p class="text-sm mt-2" style="color:var(--text-secondary);">Sign in to manage Wanderers</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div class="field">
                <input type="email" id="email" name="email" placeholder=" " required autocomplete="username">
                <label for="email">Email Address</label>
            </div>
            <div class="field">
                <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
                <label for="password">Password</label>
            </div>

            <div id="error-message" class="hidden text-sm rounded-lg px-4 py-3 flex items-center gap-2" style="background:rgba(251,113,133,0.1); border:1px solid rgba(251,113,133,0.25); color:var(--danger);">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
                <span id="error-text"></span>
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary w-full py-3.5">
                <span id="login-label">Sign In</span>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm transition" style="color:var(--accent-soft);">&larr; Back to Website</a>
        </div>
    </div>

    <script src="js/motion.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('login-btn');
            const label = document.getElementById('login-label');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.style.opacity = '0.75';
            const original = label.innerHTML;
            label.innerHTML = '<span class="spinner"></span> Signing in…';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    label.innerHTML = '<span class="spinner"></span> Redirecting…';
                    window.location.href = '/admin.html';
                } else {
                    const data = await response.json();
                    errorText.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    label.innerHTML = original;
                    document.querySelector('.glass-strong').style.animation = 'shake-field 320ms var(--ease-out)';
                    setTimeout(() => { document.querySelector('.glass-strong').style.animation = ''; }, 400);
                }
            } catch (err) {
                errorText.textContent = 'Network error. Please try again later.';
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.style.opacity = '1';
                label.innerHTML = original;
            }
        });
    </script>
</body>
</html>
